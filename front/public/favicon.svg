<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="#0a0d20"/>

  <!-- Outer dashed ring — purple -->
  <circle cx="32" cy="32" r="29.5" fill="none"
    stroke="#cc44ff" stroke-width="1.6"
    stroke-dasharray="4.5 2.5"/>

  <!-- Inner solid ring — teal -->
  <circle cx="32" cy="32" r="24" fill="none"
    stroke="#00ffe1" stroke-width="1.6"/>

  <!-- Letter G -->
  <text x="32" y="42"
    font-family="'Orbitron','Arial Black','Arial',sans-serif"
    font-size="23" font-weight="700"
    fill="#00ffe1" text-anchor="middle">G</text>
</svg>

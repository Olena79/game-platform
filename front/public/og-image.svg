<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgOrb" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#12092a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07080f" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="logoRing" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#aaffee"/>
      <stop offset="42%" stop-color="#00ffe1"/>
      <stop offset="100%" stop-color="#cc44ff"/>
    </radialGradient>

    <radialGradient id="logoFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00ffe1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cc44ff" stop-opacity="0.10"/>
    </radialGradient>

    <filter id="glowLogo" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowTitle" x="-15%" y="-80%" width="130%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowSub" x="-15%" y="-100%" width="130%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="divLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffe1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffe1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cc44ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07080f"/>
  <rect width="1200" height="630" fill="url(#bgOrb)"/>

  <!-- Stars -->
  <circle cx="87" cy="42" r="1.1" fill="#ffffff" opacity="0.35"/>
  <circle cx="210" cy="115" r="0.8" fill="#4af" opacity="0.5"/>
  <circle cx="345" cy="28" r="1.3" fill="#c07fff" opacity="0.4"/>
  <circle cx="490" cy="88" r="0.7" fill="#0fffc8" opacity="0.45"/>
  <circle cx="650" cy="18" r="1.0" fill="#ffffff" opacity="0.3"/>
  <circle cx="780" cy="65" r="1.4" fill="#4af" opacity="0.5"/>
  <circle cx="920" cy="30" r="0.9" fill="#ffffff" opacity="0.35"/>
  <circle cx="1050" cy="95" r="1.1" fill="#c07fff" opacity="0.4"/>
  <circle cx="1140" cy="48" r="0.7" fill="#0fffc8" opacity="0.4"/>
  <circle cx="55" cy="180" r="0.8" fill="#ffffff" opacity="0.25"/>
  <circle cx="165" cy="540" r="1.2" fill="#4af" opacity="0.35"/>
  <circle cx="290" cy="590" r="0.9" fill="#ffffff" opacity="0.28"/>
  <circle cx="1100" cy="200" r="1.1" fill="#c07fff" opacity="0.35"/>
  <circle cx="1160" cy="400" r="0.8" fill="#0fffc8" opacity="0.4"/>
  <circle cx="1050" cy="560" r="1.3" fill="#4af" opacity="0.35"/>
  <circle cx="900" cy="600" r="0.7" fill="#ffffff" opacity="0.3"/>
  <circle cx="750" cy="580" r="1.0" fill="#c07fff" opacity="0.3"/>
  <circle cx="420" cy="610" r="1.2" fill="#ffffff" opacity="0.28"/>
  <circle cx="120" cy="380" r="0.9" fill="#4af" opacity="0.3"/>
  <circle cx="40" cy="300" r="1.1" fill="#ffffff" opacity="0.25"/>
  <circle cx="1180" cy="320" r="0.8" fill="#0fffc8" opacity="0.3"/>

  <!-- Decorative ellipse rings -->
  <ellipse cx="600" cy="255" rx="310" ry="118" fill="none" stroke="#cc44ff" stroke-width="0.7" stroke-opacity="0.22" transform="rotate(-22 600 255)"/>
  <ellipse cx="600" cy="255" rx="265" ry="95" fill="none" stroke="#00ffe1" stroke-width="0.6" stroke-opacity="0.18" transform="rotate(18 600 255)"/>
  <ellipse cx="600" cy="255" rx="350" ry="75" fill="none" stroke="#4af" stroke-width="0.5" stroke-opacity="0.14" transform="rotate(-8 600 255)"/>

  <!-- Soft orb glow behind logo -->
  <circle cx="600" cy="255" r="180" fill="#0a0820" opacity="0.7"/>
  <circle cx="600" cy="255" r="120" fill="#080614" opacity="0.8"/>

  <!-- Logo outer glow ring -->
  <circle cx="600" cy="255" r="94" fill="none" stroke="url(#logoRing)" stroke-width="1.2" stroke-opacity="0.55" filter="url(#glowLogo)"/>

  <!-- Logo circle body -->
  <circle cx="600" cy="255" r="80" fill="url(#logoFill)"/>
  <circle cx="600" cy="255" r="80" fill="none" stroke="url(#logoRing)" stroke-width="2.2"/>

  <!-- Highlight glint -->
  <ellipse cx="582" cy="228" rx="18" ry="10" fill="white" fill-opacity="0.06" transform="rotate(-20 582 228)"/>

  <!-- G letter -->
  <text x="600" y="290"
    font-family="'Orbitron', 'Arial Black', 'Arial', sans-serif"
    font-size="72" font-weight="700" letter-spacing="-1"
    fill="#00ffe1" text-anchor="middle"
    filter="url(#glowLogo)">G</text>

  <!-- Title -->
  <text x="600" y="406"
    font-family="'Orbitron', 'Segoe UI', 'Arial', sans-serif"
    font-size="48" font-weight="700" letter-spacing="4"
    fill="white" text-anchor="middle"
    filter="url(#glowTitle)">Клуб Ігри Сенсів</text>

  <!-- Divider -->
  <rect x="440" y="426" width="320" height="1" fill="url(#divLine)"/>

  <!-- Subtitle -->
  <text x="600" y="464"
    font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
    font-size="20" font-weight="300" letter-spacing="1.5"
    fill="#cc44ff" text-anchor="middle" opacity="0.85"
    filter="url(#glowSub)">Онлайн-платформа для рольових ігор</text>

  <!-- URL label -->
  <text x="600" y="520"
    font-family="'Orbitron', 'Courier New', monospace"
    font-size="13" font-weight="400" letter-spacing="2.5"
    fill="#2a3060" text-anchor="middle">GAME-PLATFORM-RED.VERCEL.APP</text>
</svg>
